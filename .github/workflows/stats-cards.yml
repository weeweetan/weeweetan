name: Update README cards

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=f7fbfd&title_color=087f8c&text_color=334155&icon_color=0284c7&border_color=d6e4eb&disable_animations=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=08131e&title_color=58e4c2&text_color=b8c9d6&icon_color=7cc7ff&border_color=294052&disable_animations=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=f7fbfd&title_color=087f8c&text_color=334155&border_color=d6e4eb&disable_animations=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=08131e&title_color=58e4c2&text_color=b8c9d6&border_color=294052&disable_animations=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated cards
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats', 'stats-dark', 'top-langs', 'top-langs-dark'):
              path = Path('profile') / (name + '.svg')
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              text = ' '.join(root.itertext()).lower()
              assert "something went wrong" not in text, f'Failed to fetch statistics: {path}'

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/stats-dark.svg profile/top-langs.svg profile/top-langs-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile statistics" -m "Co-authored-by: Codex <noreply@openai.com>"
          git push
