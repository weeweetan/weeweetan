name: Update README cards

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keep the same renderer revision as the previous action, with a narrow
      # compatibility patch for repository-scoped GITHUB_TOKEN credentials.
      - name: Check out statistics renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: stats-organization/github-readme-stats
          ref: d79be7a9fd50ce38aef89306c8a1185fc0443bc7
          path: .stats-renderer
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install renderer dependencies
        working-directory: .stats-renderer
        run: npm ci --omit=dev --ignore-scripts

      - name: Generate profile cards
        run: node scripts/generate-profile-cards.mjs .stats-renderer
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated cards
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats', 'stats-dark', 'top-langs', 'top-langs-dark'):
              path = Path('profile') / (name + '.svg')
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              text = ' '.join(root.itertext()).lower()
              assert "something went wrong" not in text, f'Failed to fetch statistics: {path}'

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/stats.svg profile/stats-dark.svg profile/top-langs.svg profile/top-langs-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile statistics" -m "Co-authored-by: Codex <noreply@openai.com>"
          git push
